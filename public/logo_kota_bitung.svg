<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Shadow & Gold Rim -->
  <path d="M 100,8 C 160,8 190,20 190,50 C 190,145 145,210 100,234 C 55,210 10,145 10,50 C 10,20 40,8 100,8 Z" 
        fill="url(#goldBorder)" stroke="#a16207" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.25))" />

  <!-- Inner Black/Dark Rim -->
  <path d="M 100,14 C 154,14 182,24 182,52 C 182,140 140,202 100,224 C 60,202 18,140 18,52 C 18,24 46,14 100,14 Z" 
        fill="#0f172a" />

  <!-- Inner Blue Shield -->
  <path d="M 100,18 C 150,18 176,27 176,54 C 176,136 136,196 100,217 C 64,196 24,136 24,54 C 24,27 50,18 100,18 Z" 
        fill="url(#shieldBg)" />

  <!-- Five Pointed Star on Top -->
  <polygon points="100,24 104,36 117,36 107,43 111,55 100,48 89,55 93,43 83,36 96,36" 
           fill="#facc15" stroke="#ca8a04" stroke-width="0.8" />

  <!-- Mountain (Gunung Dua Saudara) -->
  <path d="M 40,140 L 75,90 L 105,125 L 130,80 L 165,140 Z" fill="url(#mountainGrad)" stroke="#14532d" stroke-width="1.5" />
  <path d="M 75,90 L 88,110 L 105,125 L 130,80 L 142,105" stroke="#86efac" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Ocean Waves (Laut Selat Lembeh) -->
  <path d="M 28,138 C 50,132 70,144 100,138 C 130,132 150,144 172,138 L 172,175 C 150,185 130,195 100,205 C 70,195 50,185 28,175 Z" 
        fill="#0284c7" />
  
  <path d="M 32,150 C 55,145 75,155 100,150 C 125,145 145,155 168,150" 
        stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8" />
  <path d="M 38,162 C 60,157 80,167 100,162 C 120,157 140,167 162,162" 
        stroke="#e0f2fe" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7" />

  <!-- Tuna / Cakalang Fish (Ikan Cakalang Ikonik Kota Bitung) -->
  <g transform="translate(100, 158) scale(0.9)">
    <path d="M -30,0 C -20,-8 10,-7 25,0 C 10,7 -20,8 -30,0 Z" fill="#f8fafc" stroke="#334155" stroke-width="1.2" />
    <path d="M 25,0 L 38,-7 L 34,0 L 38,7 Z" fill="#94a3b8" stroke="#334155" stroke-width="1" />
    <circle cx="-20" cy="-2" r="1.5" fill="#0f172a" />
    <path d="M -5,-1 L 10,-1" stroke="#cbd5e1" stroke-width="0.8" />
  </g>

  <!-- Coconut Tree & Clove Branch Symbols Left & Right -->
  <!-- Left Coconut Palm -->
  <path d="M 45,135 Q 48,100 42,75" stroke="#92400e" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 42,75 Q 25,70 20,85" stroke="#22c55e" stroke-width="2" fill="none" />
  <path d="M 42,75 Q 40,58 30,62" stroke="#22c55e" stroke-width="2" fill="none" />
  <path d="M 42,75 Q 55,60 52,72" stroke="#22c55e" stroke-width="2" fill="none" />

  <!-- Right Clove / Plant -->
  <path d="M 155,135 Q 152,100 158,75" stroke="#92400e" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 158,75 Q 175,70 180,85" stroke="#eab308" stroke-width="2" fill="none" />
  <path d="M 158,75 Q 160,58 170,62" stroke="#eab308" stroke-width="2" fill="none" />
  <path d="M 158,75 Q 145,60 148,72" stroke="#eab308" stroke-width="2" fill="none" />

  <!-- Ribbon Banner: KOTA BITUNG -->
  <g transform="translate(100, 68)">
    <rect x="-65" y="-10" width="130" height="20" rx="3" fill="#dc2626" stroke="#fbbf24" stroke-width="1.5" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.3))" />
    <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="10.5" fill="#ffffff" letter-spacing="1.5">KOTA BITUNG</text>
  </g>

  <!-- Bottom Motto Banner: KOTA BITUNG MAESA WAYA -->
  <g transform="translate(100, 202)">
    <path d="M -70,-8 L 70,-8 L 60,10 L -60,10 Z" fill="#fbbf24" stroke="#92400e" stroke-width="1" />
    <text x="0" y="4.5" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="7.5" fill="#78350f" letter-spacing="0.8">KOTA BITUNG MAESA WAYA</text>
  </g>
</svg>
